[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "jepa-parallel-unmasking"
version = "0.1.0"
description = "Archived empirical investigation of JEPA-guided parallel unmasking for LLaDA"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "torch>=2.1",
  "transformers==4.38.2",
  "datasets>=2.18",
  "PyYAML>=6.0",
  "numpy>=1.24",
  "tqdm>=4.66",
]

[tool.setuptools.packages.find]
where = ["src"]
